<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ghost Date | Join the Waitlist</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0A192F; --burgundy: #6A1B2A; --gold: #D4AF37; --bg: #F8F9FA; --surface: #FFFFFF; --text: #1C1C1E; }
  * { box-sizing: border-box; font-family: 'Outfit', sans-serif; margin: 0; padding: 0; }
  body { background: var(--navy); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .container { max-width: 480px; text-align: center; }
  h1 { font-family: 'Playfair Display', serif; font-size: 42px; color: var(--gold); margin-bottom: 10px; }
  p { font-size: 16px; color: #CBD5E1; margin-bottom: 30px; line-height: 1.5; }
  .form-card { background: var(--surface); padding: 30px; border-radius: 16px; text-align: left; color: var(--text); }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
  input, select { width: 100%; padding: 14px; border: 1px solid #E5E7EB; border-radius: 8px; margin-bottom: 16px; font-size: 15px; font-family: 'Outfit', sans-serif; }
  button { width: 100%; padding: 16px; background: var(--burgundy); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:hover { background: #851F33; }
</style>
</head>
<body>
  <div class="container">
    <h1>Ghost Date</h1>
    <p>Real connections. Your privacy. Your choice.<br>We are launching soon in Dar es Salaam. Join the private waitlist.</p>
    
    <div class="form-card">
      <form onsubmit="event.preventDefault(); alert('You are on the list! We will text you your invite code soon.');">
        <label>First Name</label>
        <input type="text" placeholder="e.g. Amina" required>

        <label>Phone Number (M-Pesa / Tigo Pesa)</label>
        <input type="tel" placeholder="e.g. 0754 123 456" required>

        <label>I am a...</label>
        <select required>
          <option value="">Select Gender</option>
          <option value="female">Woman</option>
          <option value="male">Man</option>
        </select>

        <button type="submit">Request Invite Code</button>
      </form>
    </div>
  </div>
</body>
</html>
